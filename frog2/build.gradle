tasks.named('processResources') {
    exclude 'db/**'
}

apply from: 'gradle/jspc-java22.gradle'

def verticaDriver = layout.projectDirectory.file('libs/vertica-jdbc-23.3.0-0.jar')
def verticaDriverSha256 = 'f3fdb4eae26cebe05fba4c2427ea7b3846dfa73177f5b3ad2bb020ea28721d43'
def allowedWarLibraries = [
        'HikariCP-5.1.0.jar',
        'jakarta.servlet.jsp.jstl-3.0.1.jar',
        'jakarta.servlet.jsp.jstl-api-3.0.0.jar',
        'jbcrypt-0.4.jar',
        'logback-classic-1.4.14.jar',
        'logback-core-1.4.14.jar',
        'slf4j-api-2.0.9.jar',
        'vertica-jdbc-23.3.0-0.jar'
] as Set

tasks.register('verifyVerticaDriver') {
    inputs.file(verticaDriver)
    doLast {
        def digest = sha256(verticaDriver.asFile)
        if (digest != verticaDriverSha256) {
            throw new GradleException("Unexpected Vertica JDBC checksum: ${digest}")
        }
    }
}

def packagedWar = tasks.named('war')
def verifyE2eDeployment = tasks.register(
        'verifyE2eDeployment') {
    description = 'Verifies that the selected E2E deployment matches the current WAR.'
    group = 'verification'
    dependsOn packagedWar
    inputs.file(packagedWar.flatMap { it.archiveFile })
    outputs.upToDateWhen { false }
    doLast {
        URI targetUri = URI.create(providers.systemProperty(
                'frog2.e2e.baseUrl')
                .getOrElse('http://127.0.0.1:18081/frog2/'))
        String targetHost = targetUri.host == null
                ? '' : targetUri.host.toLowerCase(Locale.ROOT)
        if (targetUri.scheme != 'http'
                || !['127.0.0.1', 'localhost'].contains(targetHost)
                || targetUri.userInfo != null
                || targetUri.rawQuery != null
                || targetUri.rawFragment != null
                || targetUri.path != '/frog2/') {
            throw new GradleException(
                    'E2E base URL must be the approved loopback application URL')
        }
        Map<String, Map<String, String>> allowedTargets = [
                '18081': [
                        base: '/opt/tomcat-dev',
                        war: '/opt/tomcat-dev/webapps/frog2.war'],
                '8080': [
                        base: '/opt/tomcat-prod-base',
                        war: '/opt/tomcat-prod-base/webapps/frog2.war']]
        Map<String, String> target = allowedTargets[
                Integer.toString(targetUri.port)]
        if (target == null) {
            throw new GradleException(
                    'E2E deployment verification supports only ports 18081 and 8080')
        }
        String deployedPath = providers.systemProperty(
                'frog2.e2e.deployedWar')
                .getOrElse(target.war)
        if (deployedPath != target.war) {
            throw new GradleException(
                    'E2E WAR path must match the selected server port')
        }
        File configuredBase = file(target.base)
        Path configuredBasePath = configuredBase.toPath()
                .toAbsolutePath().normalize()
        Path canonicalBase = configuredBase
                .canonicalFile.toPath()
        if (configuredBasePath != canonicalBase) {
            throw new GradleException(
                    'E2E CATALINA_BASE must not be a symbolic link or aliased path')
        }

        Path configuredWarPath = Path.of(deployedPath)
        if (!configuredWarPath.isAbsolute()) {
            throw new GradleException(
                    'E2E WAR path must be absolute')
        }
        File configuredWar = configuredWarPath.toFile()
        Path normalizedWarPath = configuredWarPath
                .toAbsolutePath().normalize()
        Path canonicalWarPath = configuredWar.canonicalFile.toPath()
        if (configuredWarPath != normalizedWarPath
                || normalizedWarPath != canonicalWarPath) {
            throw new GradleException(
                    'E2E WAR path must not contain symbolic links or aliases')
        }
        if (canonicalWarPath == canonicalBase
                || !canonicalWarPath.startsWith(canonicalBase)
                || canonicalWarPath != Path.of(target.war)) {
            throw new GradleException(
                    'E2E WAR must be the approved deployment artifact')
        }

        File deployedWar = canonicalWarPath.toFile()
        if (!deployedWar.isFile()) {
            throw new GradleException(
                    "E2E WAR is unavailable: ${deployedWar}")
        }

        File currentWar = packagedWar.get()
                .archiveFile.get().asFile
        String currentHash = sha256(currentWar)
        String deployedHash = sha256(deployedWar)
        if (currentHash != deployedHash) {
            throw new GradleException(
                    'E2E deployment does not match the current build. '
                            + "built=${currentHash}, deployed=${deployedHash}")
        }
    }
}

tasks.named('e2eSmoke') {
    dependsOn verifyE2eDeployment
}

tasks.named('e2eAuthenticatedSmoke') {
    dependsOn verifyE2eDeployment
}

tasks.named('classes') {
    dependsOn tasks.named('verifyVerticaDriver')
}

tasks.register('verifyWarContents') {
    dependsOn packagedWar
    inputs.file(packagedWar.flatMap { it.archiveFile })
    doLast {
        def entries = []
        String deploymentDescriptor = null
        def archive = new ZipFile(packagedWar.get().archiveFile.get().asFile)
        try {
            archive.entries().each { entries.add(it.name) }
            def webXmlEntry = archive.getEntry('WEB-INF/web.xml')
            if (webXmlEntry != null) {
                deploymentDescriptor = archive.getInputStream(webXmlEntry)
                        .getText('UTF-8')
            }
        } finally {
            archive.close()
        }

        def packagedLibraries = entries
                .findAll { it.startsWith('WEB-INF/lib/') && it.endsWith('.jar') }
                .collect { it.substring('WEB-INF/lib/'.length()) }
                .toSet()
        def unexpectedLibraries = packagedLibraries - allowedWarLibraries
        def missingLibraries = allowedWarLibraries - packagedLibraries
        def forbiddenEntries = entries.findAll { entry ->
            def segments = entry.tokenize('/')
            entry.endsWith('.java')
                    || entry.contains('db.properties')
                    || entry.startsWith('META-INF/maven/')
                    || entry.startsWith('WEB-INF/classes/db/')
                    || segments.any { it in ['build', '.settings', '.classpath', '.project'] }
        }
        def precompiledJspClasses = entries.findAll { entry ->
            entry.startsWith('WEB-INF/classes/org/apache/jsp/')
                    && entry.endsWith('_jsp.class')
        }
        def mappedJspClasses = deploymentDescriptor == null
                ? []
                : (deploymentDescriptor =~ /<servlet-class>(org\.apache\.jsp\.[^<]+_jsp)<\/servlet-class>/)
                        .collect { match -> match[1] }
        def missingPrecompiledJspClasses = mappedJspClasses.findAll { className ->
            !entries.contains(
                    'WEB-INF/classes/' + className.replace('.', '/') + '.class')
        }

        if (unexpectedLibraries || missingLibraries || forbiddenEntries
                || mappedJspClasses.isEmpty()
                || precompiledJspClasses.size() != mappedJspClasses.size()
                || !missingPrecompiledJspClasses.isEmpty()) {
            throw new GradleException(
                    "WAR allowlist violation. unexpectedLibraries=${unexpectedLibraries}, "
                            + "missingLibraries=${missingLibraries}, forbiddenEntries=${forbiddenEntries}, "
                            + "precompiledJspClasses=${precompiledJspClasses.size()}, "
                            + "mappedJspClasses=${mappedJspClasses.size()}, "
                            + "missingPrecompiledJspClasses=${missingPrecompiledJspClasses}")
        }
    }
}

def firstPartyJavaScript = files(
        fileTree('src/main/webapp/resources/js') {
            include '**/*.js'
        },
        fileTree('src/tools') {
            include '**/*.mjs'
        })
def javaScriptSyntaxTasks = firstPartyJavaScript.files
        .sort { left, right -> left.path <=> right.path }
        .collect { source ->
            String relativePath = projectDir.toPath()
                    .relativize(source.toPath())
                    .toString()
            String taskSuffix = relativePath
                    .split('[^A-Za-z0-9]+')
                    .findAll { !it.isBlank() }
                    .collect { it.capitalize() }
                    .join('')
            tasks.register("checkJavaScriptSyntax${taskSuffix}", Exec) {
                group = 'verification'
                description = "Checks JavaScript syntax: ${relativePath}"
                inputs.file(source)
                outputs.upToDateWhen { false }
                commandLine 'node', '--check', source.absolutePath
            }
        }

tasks.register('checkJavaScriptSyntax') {
    description = 'Checks syntax for all first-party JavaScript modules.'
    group = 'verification'
    dependsOn javaScriptSyntaxTasks
}

def javaScriptBehaviorTests = fileTree('src/test/java') {
    include '**/*.behavior.test.js'
}

tasks.register('testJavaScript', Exec) {
    description = 'Runs first-party JavaScript behavior tests with Node.js.'
    group = 'verification'
    inputs.files(javaScriptBehaviorTests)
    outputs.upToDateWhen { false }
    commandLine(['node', '--test'] + javaScriptBehaviorTests.files
            .sort { left, right -> left.path <=> right.path }
            .collect { it.absolutePath })
}

tasks.register('frontendCheck') {
    description = 'Runs JavaScript syntax and behavior verification.'
    group = 'verification'
    dependsOn tasks.named('checkJavaScriptSyntax')
    dependsOn tasks.named('testJavaScript')
}

tasks.named('check') {
    dependsOn tasks.named('verifyWarContents')
    dependsOn tasks.named('frontendCheck')
}

tasks.named('war') {
    archiveFileName = 'frog2.war'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL
    exclude 'META-INF/MANIFEST.MF'
    exclude '**/.classpath', '**/.project', '**/.settings/**'
    exclude '**/build/**', '**/db.properties', '**/db.properties.*'
    exclude 'WEB-INF/classes/db/**'
}
