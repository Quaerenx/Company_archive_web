import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'java'
    id 'war'
}

group = 'com.company'
version = '2.0.0-SNAPSHOT'

def sha256 = { File input ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

repositories {
    mavenCentral()
}


dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    compileOnly 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.0'

    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'
    implementation 'ch.qos.logback:logback-core:1.4.14'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation('jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0') {
        exclude group: 'jakarta.servlet', module: 'jakarta.servlet-api'
        exclude group: 'jakarta.el', module: 'jakarta.el-api'
    }
    runtimeOnly 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
    runtimeOnly files('libs/vertica-jdbc-23.3.0-0.jar')

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 22
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    def testCatalinaBase = layout.buildDirectory.dir("test-catalina/${name}")
    systemProperty 'catalina.base', testCatalinaBase.get().asFile.absolutePath
    doFirst {
        testCatalinaBase.get().asFile.mkdirs()
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'e2e', 'e2e-write', 'e2e-schema', 'e2e-https'
    }
}

tasks.register('e2eSmoke', Test) {
    description = 'Runs GET-only HTTP smoke tests against a running Frog2 server.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
    outputs.upToDateWhen { false }
    systemProperty 'frog2.e2e.authenticated', 'false'
    for (String propertyName : [
            'frog2.e2e.baseUrl', 'frog2.e2e.allowRemote'
    ]) {
        String value = providers.systemProperty(propertyName).orNull
        if (value != null) {
            systemProperty propertyName, value
        }
    }
    useJUnitPlatform {
        includeTags 'e2e'
    }
}

tasks.register('e2eAuthenticatedSmoke', Test) {
    description = 'Runs authenticated read-only navigation smoke tests against Frog2.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
    outputs.upToDateWhen { false }
    systemProperty 'frog2.e2e.authenticated', 'true'
    for (String propertyName : [
            'frog2.e2e.baseUrl', 'frog2.e2e.allowRemote'
    ]) {
        String value = providers.systemProperty(propertyName).orNull
        if (value != null) {
            systemProperty propertyName, value
        }
    }
    useJUnitPlatform {
        includeTags 'e2e'
    }
}

tasks.register('e2eWrite', Test) {
    description = 'Runs bounded authenticated write and load checks against isolated staging.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    useJUnitPlatform {
        includeTags 'e2e-write'
    }
}

tasks.register('schemaAudit', Test) {
    description = 'Runs a metadata-only audit of active database migrations.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    useJUnitPlatform {
        includeTags 'e2e-schema'
    }
}

tasks.register('httpsCookieAudit', Test) {
    description = 'Verifies hardened Archive session cookies on an explicit HTTPS endpoint.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    useJUnitPlatform {
        includeTags 'e2e-https'
    }
}

tasks.named('processResources') {
    exclude 'db/**'
}

def verticaDriver = layout.projectDirectory.file('libs/vertica-jdbc-23.3.0-0.jar')
def verticaDriverSha256 = 'f3fdb4eae26cebe05fba4c2427ea7b3846dfa73177f5b3ad2bb020ea28721d43'
def allowedWarLibraries = [
        'HikariCP-5.1.0.jar',
        'jakarta.servlet.jsp.jstl-3.0.1.jar',
        'jakarta.servlet.jsp.jstl-api-3.0.0.jar',
        'jbcrypt-0.4.jar',
        'logback-classic-1.4.14.jar',
        'logback-core-1.4.14.jar',
        'slf4j-api-2.0.9.jar',
        'vertica-jdbc-23.3.0-0.jar'
] as Set

tasks.register('verifyVerticaDriver') {
    inputs.file(verticaDriver)
    doLast {
        def digest = sha256(verticaDriver.asFile)
        if (digest != verticaDriverSha256) {
            throw new GradleException("Unexpected Vertica JDBC checksum: ${digest}")
        }
    }
}

def packagedWar = tasks.named('war')
def verifyDevelopmentDeployment = tasks.register(
        'verifyDevelopmentDeployment') {
    description = 'Verifies that the development deployment matches the current WAR.'
    group = 'verification'
    dependsOn packagedWar
    inputs.file(packagedWar.flatMap { it.archiveFile })
    outputs.upToDateWhen { false }
    doLast {
        String deployedPath = providers.systemProperty(
                'frog2.e2e.deployedWar')
                .getOrElse('/opt/tomcat-dev/webapps/frog2.war')
        File deployedWar = file(deployedPath).canonicalFile
        File productionWar = file(
                '/opt/tomcat/webapps/frog2.war').canonicalFile
        if (deployedWar == productionWar) {
            throw new GradleException(
                    'Production WAR cannot be used for development E2E verification')
        }
        if (!deployedWar.isFile()) {
            throw new GradleException(
                    "Development WAR is unavailable: ${deployedWar}")
        }

        File currentWar = packagedWar.get()
                .archiveFile.get().asFile
        String currentHash = sha256(currentWar)
        String deployedHash = sha256(deployedWar)
        if (currentHash != deployedHash) {
            throw new GradleException(
                    'Development deployment does not match the current build. '
                            + "built=${currentHash}, deployed=${deployedHash}")
        }
    }
}

tasks.named('e2eSmoke') {
    dependsOn verifyDevelopmentDeployment
}

tasks.named('e2eAuthenticatedSmoke') {
    dependsOn verifyDevelopmentDeployment
}

tasks.named('classes') {
    dependsOn tasks.named('verifyVerticaDriver')
}

tasks.register('verifyWarContents') {
    dependsOn packagedWar
    inputs.file(packagedWar.flatMap { it.archiveFile })
    doLast {
        def entries = []
        def archive = new ZipFile(packagedWar.get().archiveFile.get().asFile)
        try {
            archive.entries().each { entries.add(it.name) }
        } finally {
            archive.close()
        }

        def packagedLibraries = entries
                .findAll { it.startsWith('WEB-INF/lib/') && it.endsWith('.jar') }
                .collect { it.substring('WEB-INF/lib/'.length()) }
                .toSet()
        def unexpectedLibraries = packagedLibraries - allowedWarLibraries
        def missingLibraries = allowedWarLibraries - packagedLibraries
        def forbiddenEntries = entries.findAll { entry ->
            def segments = entry.tokenize('/')
            entry.endsWith('.java')
                    || entry.contains('db.properties')
                    || entry.startsWith('META-INF/maven/')
                    || entry.startsWith('WEB-INF/classes/db/')
                    || segments.any { it in ['build', '.settings', '.classpath', '.project'] }
        }

        if (unexpectedLibraries || missingLibraries || forbiddenEntries) {
            throw new GradleException(
                    "WAR allowlist violation. unexpectedLibraries=${unexpectedLibraries}, "
                            + "missingLibraries=${missingLibraries}, forbiddenEntries=${forbiddenEntries}")
        }
    }
}

def firstPartyJavaScript = files(
        fileTree('src/main/webapp/resources/js') {
            include '**/*.js'
        },
        fileTree('src/tools') {
            include '**/*.mjs'
        })
def javaScriptSyntaxTasks = firstPartyJavaScript.files
        .sort { left, right -> left.path <=> right.path }
        .collect { source ->
            String relativePath = projectDir.toPath()
                    .relativize(source.toPath())
                    .toString()
            String taskSuffix = relativePath
                    .split('[^A-Za-z0-9]+')
                    .findAll { !it.isBlank() }
                    .collect { it.capitalize() }
                    .join('')
            tasks.register("checkJavaScriptSyntax${taskSuffix}", Exec) {
                group = 'verification'
                description = "Checks JavaScript syntax: ${relativePath}"
                inputs.file(source)
                outputs.upToDateWhen { false }
                commandLine 'node', '--check', source.absolutePath
            }
        }

tasks.register('checkJavaScriptSyntax') {
    description = 'Checks syntax for all first-party JavaScript modules.'
    group = 'verification'
    dependsOn javaScriptSyntaxTasks
}

def javaScriptBehaviorTests = fileTree('src/test/java') {
    include '**/*.behavior.test.js'
}

tasks.register('testJavaScript', Exec) {
    description = 'Runs first-party JavaScript behavior tests with Node.js.'
    group = 'verification'
    inputs.files(javaScriptBehaviorTests)
    outputs.upToDateWhen { false }
    commandLine(['node', '--test'] + javaScriptBehaviorTests.files
            .sort { left, right -> left.path <=> right.path }
            .collect { it.absolutePath })
}

tasks.register('frontendCheck') {
    description = 'Runs JavaScript syntax and behavior verification.'
    group = 'verification'
    dependsOn tasks.named('checkJavaScriptSyntax')
    dependsOn tasks.named('testJavaScript')
}

tasks.named('check') {
    dependsOn tasks.named('verifyWarContents')
    dependsOn tasks.named('frontendCheck')
}

tasks.named('war') {
    archiveFileName = 'frog2.war'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL
    exclude 'META-INF/MANIFEST.MF'
    exclude '**/.classpath', '**/.project', '**/.settings/**'
    exclude '**/build/**', '**/db.properties', '**/db.properties.*'
    exclude 'WEB-INF/classes/db/**'
}

apply from: 'gradle/jspc-java22.gradle'
