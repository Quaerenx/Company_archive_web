}

tasks.register('schemaAudit', Test) {
    description = 'Runs a metadata-only audit of active database migrations.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
