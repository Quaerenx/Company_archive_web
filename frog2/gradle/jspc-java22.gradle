import java.util.jar.JarFile

def jspcCatalinaHome = providers.gradleProperty('frog2JspcCatalinaHome')
        .orElse('/opt/tomcat-dev-home/current')
def expectedJasperVersion = providers.gradleProperty('frog2JspcJasperVersion')
        .orElse('10.1.59')
def jspcRoot = layout.buildDirectory.dir('jspc')
def jspcWebapp = jspcRoot.map { it.dir('webapp') }
def jspcGeneratedSources = jspcRoot.map { it.dir('generated') }
def jspcCompiledClasses = jspcRoot.map { it.dir('classes') }
def jspcWebFragment = jspcRoot.map { it.file('generated-web.xml') }

def jspcTomcatLibraries = files(providers.provider {
    File catalinaHome = file(jspcCatalinaHome.get())
    Set<File> libraries = new LinkedHashSet<>(
            fileTree(new File(catalinaHome, 'lib')) {
                include '*.jar'
            }.files)
    libraries.add(new File(catalinaHome, 'bin/tomcat-juli.jar'))
    libraries
})
def jspcGradleAntLibraries = files(providers.provider {
    fileTree(new File(gradle.gradleHomeDir, 'lib')) {
        include 'ant-*.jar'
    }.files
})

def verifyJspcEnvironment = tasks.register('verifyJspcEnvironment') {
    group = 'verification'
    description = 'Verifies the read-only Tomcat and Java 22 JspC toolchain inputs.'
    inputs.property('catalinaHome', jspcCatalinaHome)
    inputs.property('expectedJasperVersion', expectedJasperVersion)
    doLast {
        File catalinaHome = file(jspcCatalinaHome.get())
        List<String> requiredFiles = [
                'bin/tomcat-juli.jar',
                'lib/jasper.jar',
                'lib/jsp-api.jar',
                'lib/servlet-api.jar'
        ]
        List<String> missingFiles = requiredFiles.findAll {
            !new File(catalinaHome, it).isFile()
        }
        if (!missingFiles.isEmpty()) {
            throw new GradleException(
                    "JspC validation requires a Tomcat home containing ${missingFiles}: "
                            + catalinaHome)
        }

        File jasperJar = new File(catalinaHome, 'lib/jasper.jar')
        String implementationVersion
        new JarFile(jasperJar).withCloseable { archive ->
            implementationVersion = archive.manifest?.mainAttributes
                    ?.getValue('Implementation-Version')
        }
        if (implementationVersion != expectedJasperVersion.get()) {
            throw new GradleException(
                    "Unexpected Tomcat Jasper version: ${implementationVersion ?: 'unknown'}; "
                            + "expected ${expectedJasperVersion.get()}")
        }
        logger.lifecycle(
                'JspC source generation uses Tomcat Jasper {} from {}',
                implementationVersion ?: 'unknown',
                jasperJar)
    }
}

def prepareJspcWebapp = tasks.register('prepareJspcWebapp', Sync) {
    group = 'verification'
    description = 'Expands the reproducible WAR for JSP source generation.'
    dependsOn tasks.named('war')
    from {
        zipTree(tasks.named('war').get().archiveFile.get().asFile)
    }
    into jspcWebapp
}

def generateJspSources = tasks.register('generateJspSources', JavaExec) {
    group = 'verification'
    description = 'Generates servlet Java sources from every JSP without ECJ compilation.'
    dependsOn prepareJspcWebapp, verifyJspcEnvironment
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(22)
    }
    classpath = jspcTomcatLibraries + jspcGradleAntLibraries
    mainClass = 'org.apache.jasper.JspC'
    inputs.file(tasks.named('war').flatMap { it.archiveFile })
    outputs.dir(jspcGeneratedSources)
    outputs.file(jspcWebFragment)
    doFirst {
        delete jspcGeneratedSources
        jspcGeneratedSources.get().asFile.mkdirs()
        jspcWebFragment.get().asFile.parentFile.mkdirs()
        args '-webapp', jspcWebapp.get().asFile.absolutePath,
                '-d', jspcGeneratedSources.get().asFile.absolutePath,
                '-webinc', jspcWebFragment.get().asFile.absolutePath,
                '-failFast',
                '-javaEncoding', 'UTF-8'
    }
}

def compileJspJava22 = tasks.register('compileJspJava22', JavaCompile) {
    group = 'verification'
    description = 'Compiles generated JSP servlet sources with javac --release 22.'
    dependsOn generateJspSources
    source jspcGeneratedSources
    destinationDirectory = jspcCompiledClasses
    classpath = jspcTomcatLibraries + sourceSets.main.runtimeClasspath
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(22)
    }
    options.encoding = 'UTF-8'
    options.release = 22
}

tasks.register('jspcJava22') {
    group = 'verification'
    description = 'Generates all JSP servlet sources and compiles them with Java 22.'
    dependsOn compileJspJava22
    doLast {
        int sourceCount = fileTree(jspcGeneratedSources) {
            include '**/*.java'
        }.files.size()
        int classCount = fileTree(jspcCompiledClasses) {
            include '**/*.class'
        }.files.size()
        if (sourceCount == 0 || classCount == 0) {
            throw new GradleException(
                    "JspC Java 22 produced no output: sources=${sourceCount}, classes=${classCount}")
        }
        logger.lifecycle(
                'JspC Java 22 verification completed: {} sources, {} classes',
                sourceCount,
                classCount)
    }
}

tasks.named('check') {
    dependsOn tasks.named('jspcJava22')
}
